<h1>【宣導】身心障礙者權利公約(CRPD)</h1>
<div class="news-body">
<p>衛生福利部社會及家庭署宣達身心障礙者權利公約，</p><p>以利社會大眾及同仁認識身障者及公約意涵。</p><p>&nbsp;</p><p>▎落實身心障礙者權利公約推動計畫</p><p>「身心障礙者權利公約(CRPD)施行法」於103年12月3日公布施行。</p><p>為各級政府機關依法推動CRPD施行法，以落實CRPD權益保障事項，</p><p>擬訂「落實身心障礙者權利公約（CRPD）推動計畫」。</p><p><a href="https://crpd.sfaa.gov.tw/">立即前往&gt;</a></p>
