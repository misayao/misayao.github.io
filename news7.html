<h1>公告：停車場鋪面改善工程</h1>
<div class="news-body">
<p>為提升園區停車場環境品質，提供更安全、舒適的停車空間</p><p>中原文創園區停車場將於1/19(一)至1/30(五)進行鋪面改善工程</p><p>施工期間，禁止車輛進出</p><p>欲停車車輛請改道至停車場後方「臨時停車區」停放並由同一出入口進出</p><p>如造成不便，敬請見諒！</p>
