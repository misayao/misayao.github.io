<h1>5倉桃藝工坊展售暫停公告</h1>
<div class="news-body">
<p><strong>桃藝工坊展售暫停公告</strong></p><p>&nbsp;</p><p>因應2026年新增進駐品牌及整體空間規劃調整，</p><p>自2026年1月7日起，</p><p>將暫停基地內品牌展售服務，並進行櫃位改裝作業。</p><p>&nbsp;</p><p>桃藝工坊預計於2026年2月以嶄新面貌重新開放，</p><p>誠摯邀請大家再次蒞臨，敬請期待！</p><p>&nbsp;</p><p>如有造成不便之處，敬請見諒。</p>
